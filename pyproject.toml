[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reflex-brain"
version = "0.2.0"
description = "Continual learning brain for AI agents: lessons, skills, memories with evidence-based refinement, rollback, and GraphRAG retrieval. MCP-compatible, agent-agnostic."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Jesus Caicedo", email = "jesuscaicedo800@gmail.com"}]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.19",
    "sentence-transformers>=2.2",
    "faiss-cpu>=1.7",
    "networkx>=3.2",
    "spacy>=3.7",
    "numpy>=1.24",
    "scipy>=1.10,<2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "mcp>=1.26,<2",
    "anyio>=4.0",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "croniter>=2,<7",
    "typer>=0.12,<1",
    "rich>=13,<16",
    "jsonschema>=4.20,<5",
    "filelock>=3.12,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.6",
]
web = [
    "firecrawl>=1.0",
]

[project.scripts]
reflex-brain = "continual_brain.cli.main:app"
reflex-brain-mcp = "continual_brain.mcp.server:run"

[tool.hatch.build.targets.wheel]
packages = ["continual_brain"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "PIE", "T20", "PTH", "ERA", "PL", "TRY", "ARG", "NPY", "PERF", "RET"]
ignore = ["S101", "S311", "B008", "ARG001", "ARG002", "TRY003", "NPY002"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["continual_brain"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
